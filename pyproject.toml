[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "oauth-connection-recovery"
version = "0.1.0"
requires-python = ">=3.12"
description = "Inspect OAuth rotation failures and safe reconnection against a local OAuthLib provider"
dependencies = ["oauthlib>=3.3,<5", "requests>=2.32,<3", "cryptography>=46,<51", "flask>=3.1,<4"]
[tool.setuptools.packages.find]
include = ["recovery*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
